<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 云端/登录/历史事件控件样式（仅新增，不影响原画布样式） -->
<link rel="stylesheet" href="css/cloud.css">
<!-- Supabase JS SDK（v2，UMD 全局 window.supabase） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>架空王朝疆域全图 · 可编辑版</title>
<style>
  :root{
    --ink:#3d2b1a; --paper:#f0e7d0; --paper2:#e7dcc1;
    --accent:#a83c2a; --line:#6b4f2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
    color:var(--ink); background:var(--paper);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ============ 顶栏 ============ */
  header{
    background:linear-gradient(#f5edd9,#e9dfc4);
    border-bottom:2px solid var(--line);
    padding:8px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .dynasty{font-size:24px;font-weight:bold;letter-spacing:3px;border-radius:4px;padding:2px 8px;outline:none}
  .dynasty[contenteditable="true"]{background:#fff8e6;box-shadow:inset 0 0 0 1px var(--accent)}
  .sub{font-size:12px;color:#7a5c33}
  .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{
    font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    background:#f7efda;border:1px solid var(--line);border-radius:4px;padding:5px 12px;
  }
  button:hover{background:#fff6de}
  button.primary{background:var(--accent);color:#f7efda;border-color:#7d2c1e}
  button.primary:hover{background:#bd4632}
  button.on{background:var(--ink);color:#f7efda}
  #saveState{font-size:11px;color:#7a5c33;min-width:128px;text-align:right}
  /* ============ 主区 ============ */
  main{flex:1;display:flex;min-height:0}
  #mapWrap{flex:1;position:relative;background:var(--paper);overflow:hidden}
  #map{width:100%;height:100%;display:block;cursor:grab}
  #map.dragging{cursor:grabbing}
  .regionPath{stroke-linejoin:round;cursor:pointer;transition:filter .12s}
  .regionPath:hover{filter:brightness(1.08)}
  .regionPath.lost{opacity:.5;cursor:default}
  .rlabel.lost{font-style:italic}
  /* 朝代切换 */
  .dynSwitch{display:flex;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .dynSwitch button{border:none;border-radius:0;border-right:1px solid var(--line);padding:5px 10px;font-size:14px}
  .dynSwitch button:last-child{border-right:none}
  .dynSwitch button.on{background:var(--ink);color:#f7efda}
  .dynYears{font-size:11px;color:#7a5c33;max-width:180px;line-height:1.4}
  .seamLine{fill:none;stroke:#fff;stroke-width:1;opacity:.55;pointer-events:none}
  .rlabel{font-size:15px;font-weight:bold;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#f4ecd6;stroke-width:3.4px;stroke-linejoin:round}
  .statelabel{font-size:10px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#f7efda;stroke-width:2.6px}
  .statelabel.imp{font-size:11.5px;font-weight:bold}
  .statedot{cursor:pointer}
  .statedot circle{transition:r .12s}
  .statedot:hover circle{r:5.5}
  .statedot.sel circle{fill:var(--accent)}
  .geoLine{fill:none;pointer-events:none}
  .mapnote{font-size:13px;fill:#7a6a3a;pointer-events:none}
  .seaText{font-size:15px;fill:#5b7d9c;pointer-events:none;letter-spacing:5px}
  /* 缩放控件 */
  .zoomCtl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:4px}
  .zoomCtl button{width:34px;height:30px;font-size:17px;padding:0}
  .hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:#7a5c33;background:#f2ead6cc;border:1px solid #b89c6a;border-radius:4px;padding:5px 10px}
  /* ============ 侧栏 ============ */
  aside{
    width:372px;min-width:372px;background:#f6eeda;border-left:2px solid var(--line);
    overflow-y:auto;padding:18px 20px;
  }
  .empty{color:#8a7450;font-size:13px;line-height:2;margin-top:30px;text-align:center}
  .badge{display:inline-block;font-size:11px;background:var(--accent);color:#f7efda;border-radius:3px;padding:1px 8px;margin-bottom:10px}
  .badge.state{background:#5b7d9c}
  h2{font-size:20px;margin-bottom:4px}
  .field{margin-top:14px}
  .field label{display:block;font-size:12px;color:#7a5c33;margin-bottom:4px}
  .field input[type=text],.field textarea{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:3px;padding:5px 7px;resize:vertical;
  }
  .field input.rd,.field textarea.rd{cursor:default}
  body.editing .field input[type=text],body.editing .field textarea{background:#fffaf0;border-color:#c8b487}
  .field input[type=color]{width:46px;height:28px;border:1px solid #c8b487;background:#fffaf0;border-radius:3px;vertical-align:middle;cursor:pointer}
  .county-box{font-size:13px;line-height:1.9;background:#fffaf0aa;border-radius:4px;padding:7px 10px}
  .county-chip{display:inline-block;margin:2px 3px;padding:1px 8px;background:#efe4c8;border:1px solid #cdb885;border-radius:10px;font-size:12px;cursor:pointer}
  .county-chip:hover{background:#fff}
  .story-box{
    font-size:13.5px;line-height:2;background:#fbf3df;border-left:3px solid var(--accent);
    border-radius:0 4px 4px 0;padding:8px 12px;white-space:pre-wrap;
  }
  .geo-box{font-size:13.5px;line-height:1.95;white-space:pre-wrap}
  .stateList{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .stateList .county-chip{border-color:#8fb0c9;background:#e6eef5}
  .addbtn{margin-top:10px;font-size:12px;padding:3px 10px}
  .readonly-tip{font-size:11px;color:#a0895a;margin-top:18px;text-align:center}
  @media print{
    header,aside,.zoomCtl,.hint{display:none!important}
    main{display:block} #mapWrap{height:100vh}
  }
</style>
</head>
<body>

<!-- ================= 登录遮罩：未登录拦截（无注册入口） ================= -->
<div id="authGate">
  <form class="auth-card" id="authForm" autocomplete="off">
    <h1>疆域画布 · 登录</h1>
    <div class="auth-sub">账号由管理员在 Supabase 后台创建，不开放注册</div>
    <label for="authEmail">邮箱</label>
    <input type="email" id="authEmail" required placeholder="you@example.com">
    <label for="authPassword">密码</label>
    <input type="password" id="authPassword" required placeholder="••••••••">
    <button type="submit" id="authSubmit">登 录</button>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-tip">
      为防平台策略变更，登录后请定期使用顶部「导出备份」<br>把画布 JSON 保存到本地做备份。
    </div>
  </form>
</div>

<header>
  <span class="dynasty" id="dynasty" title="可直接编辑国号">【国号】</span>
  <span class="sub" id="subtitle">疆域全图 · 晋汉唐宋明五朝合制 · 双时间线通用底图</span>
  <div class="dynSwitch" id="dynSwitch"></div>
  <span class="dynYears" id="dynYears"></span>
  <div class="toolbar">
    <span id="userChip"></span>
    <span id="saveState"></span>
    <button id="saveCloudBtn" title="把当前画布写入 Supabase canvas_data 表">💾 保存云端</button>
    <button id="loadCloudBtn" title="从 Supabase 读取本人最新画布">☁ 加载云端</button>
    <button id="editBtn" class="primary">✎ 进入编辑</button>
    <button id="exportBtn" title="导出画布 JSON 到本地（建议定期备份）">⬇ 导出备份</button>
    <button id="importBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button id="clearBtn" title="清空当前画布（可用恢复默认还原模板）">🗑 清空画布</button>
    <button id="resetBtn">恢复默认</button>
    <button id="printBtn">打印</button>
    <button id="logoutBtn" title="退出登录">⏻ 退出</button>
  </div>
</header>

  <aside id="panel">

</main>

try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY));

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(LS_KEY, JSON.stringify(DATA));
    const d = new Date();
    document.getElementById("saveState").textContent =
      "已自动保存 " + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
  }, 400);
}

/* ================================================================
   渲染
   ================================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const layerRegions = document.getElementById("layerRegions");
const layerSeams   = document.getElementById("layerSeams");
const layerSel     = document.getElementById("layerSel");
const layerGeo     = document.getElementById("layerGeo");
const layerRLabels = document.getElementById("layerRLabels");
const layerStates  = document.getElementById("layerStates");
const layerSLabels = document.getElementById("layerSLabels");

function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function render(){
  layerRegions.innerHTML=""; layerSeams.innerHTML=""; layerSel.innerHTML="";
  layerRLabels.innerHTML=""; layerStates.innerHTML=""; layerSLabels.innerHTML="";
  DATA.regions.forEach((r, ri)=>{
    const lost = isLost(r.name);
    // 同色宽描边作光晕，覆盖拼接缝隙
    const p = el("path",{d:r.d, fill:lost?"#b9b099":r.color, stroke:lost?"#b9b099":r.color, "stroke-width":6, class:"regionPath"+(lost?" lost":"")});
    p.addEventListener("click",(e)=>{e.stopPropagation(); selectRegion(ri);});
    layerRegions.appendChild(p);
    // 白色细界缝
    layerSeams.appendChild(el("path",{d:r.d,class:"seamLine"}));
    // 选中红框
    if(selected&&selected.type==="region"&&selected.ri===ri){
      layerSel.appendChild(el("path",{d:r.d,fill:"none",stroke:"#a83c2a","stroke-width":2.4}));
    }

    const t = el("text",{x:r.cx,y:r.cy,class:"rlabel"+(lost?" lost":"")+"",fill:lost?"#6b6352":"#3d2b1a"});
    t.textContent = lost ? r.name+"(异域)" : r.name;
    layerRLabels.appendChild(t);

    r.states.forEach((s, si)=>{
      if(lost) return; // 失地不绘州点
      const g = el("g",{class:"statedot"});
      g.appendChild(el("circle",{cx:s.x,cy:s.y,r:s.imp?4.4:3,fill:"#2e2013"}));
      if(s.imp) g.appendChild(el("circle",{cx:s.x,cy:s.y,r:6.6,fill:"none",stroke:"#f2c14e","stroke-width":1.3}));
      g.addEventListener("click",(e)=>{e.stopPropagation(); selectState(ri,si);});
      if(selected&&selected.type==="state"&&selected.ri===ri&&selected.si===si) g.classList.add("sel");
      layerStates.appendChild(g);

      if(s.imp){
        const st2 = el("text",{x:s.x,y:s.y-8,class:"statelabel imp",fill:"#2e2013"});
        st2.textContent = s.n;
        layerSLabels.appendChild(st2);
      }
    });
  });
  renderGeo();
  applyZoomLabels();
  if(window.HistoryLayer) HistoryLayer.render();
}

/* 非重要州名按缩放级别显示 */
function applyZoomLabels(){
  const showAll = scale >= 1.55;
  if(showAll && !layerSLabels.dataset.all){
    DATA.regions.forEach((r,ri)=>r.states.forEach((s,si)=>{
      if(s.imp) return;
      const t=el("text",{x:s.x,y:s.y-7,class:"statelabel",fill:"#2e2013"});
      t.textContent=s.n; t.dataset.ri=ri; t.dataset.si=si;
      layerSLabels.appendChild(t);
    }));
    layerSLabels.dataset.all="1";
  }else if(!showAll && layerSLabels.dataset.all){
    layerSLabels.querySelectorAll("[data-ri]").forEach(n=>n.remove());
    delete layerSLabels.dataset.all;
  }
}

function selectRegion(ri){ selected={type:"region",ri}; render(); renderPanel(); }
function selectState(ri,si){ selected={type:"state",ri,si}; render(); renderPanel(); }

const panel = document.getElementById("panel");
function fieldHTML(label, inner, extra=""){
  return `<div class="field" ${extra}><label>${label}</label>${inner}</div>`;
}
function renderPanel(){

        ? `<textarea data-k="folk" rows="2">${esc(r.folk||"")}</textarea>`
        : `<div class="geo-box">${esc(r.folk||"—")}</div>`)}
      ${fieldHTML("方言与黑话",editing
        ? `<textarea data-k="slang" rows="2">${esc(r.slang||"")}</textarea>`
        : `<div class="geo-box">${esc(r.slang||"—")}</div>`)}
      ${fieldHTML("江湖门派与地方势力",editing
        ? `<textarea data-k="sects" rows="3">${esc(r.sects||"")}</textarea>`
        : `<div class="geo-box">${esc(r.sects||"—")}</div>`)}
      ${fieldHTML("饮食与日常生活",editing
        ? `<textarea data-k="food" rows="2">${esc(r.food||"")}</textarea>`

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function bindPanel(){
  panel.querySelectorAll("[data-k]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const k = inp.dataset.k;
      const obj = selected.type==="region" ? DATA.regions[selected.ri] : DATA.regions[selected.ri].states[selected.si];
      if(k==="co"){ obj.co = inp.value.split("\n").map(s=>s.trim()).filter(Boolean); }
      else obj[k] = inp.value;
      if(k==="name"||k==="n"||k==="color") render();
      scheduleSave();
    });
  });
  panel.querySelectorAll("[data-go]").forEach(c=>{
    c.addEventListener("click",()=>selectState(selected.ri,+c.dataset.go));
  });
  const addBtn=document.getElementById("addState");
  if(addBtn) addBtn.addEventListener("click",()=>{
    const r=DATA.regions[selected.ri];
    r.states.push({n:"【新州府】",x:r.cx+10,y:r.cy+10,co:["【新县】"]});
    scheduleSave(); render(); renderPanel();
  });
}

/* ================================================================
   缩放 / 平移
   ================================================================ */
const viewport = document.getElementById("viewport");
let scale=1, tx=0, ty=0;
function updateT(){ viewport.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`); applyZoomLabels(); }
function zoomAt(f, cx, cy){
  const ns = Math.min(3.2, Math.max(0.85, scale*f));
  const f2 = ns/scale;
  tx = cx - (cx-tx)*f2; ty = cy - (cy-ty)*f2; scale = ns;
  updateT();
}
document.getElementById("zin").onclick=()=>zoomAt(1.25,640,480);
document.getElementById("zout").onclick=()=>zoomAt(0.8,640,480);
document.getElementById("zreset").onclick=()=>{scale=1;tx=0;ty=0;updateT();};

const mapEl=document.getElementById("map");
mapEl.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const pt = svgPoint(e.clientX,e.clientY);
  zoomAt(e.deltaY<0?1.12:0.89, pt.x, pt.y);
},{passive:false});
function svgPoint(cx,cy){
  const r = mapEl.getBoundingClientRect();
  // account for meet-aspect padding
  const vb={w:1280,h:960};
  const s=Math.min(r.width/vb.w,r.height/vb.h);
  const ox=r.left+(r.width-vb.w*s)/2, oy=r.top+(r.height-vb.h*s)/2;
  return {x:(cx-ox)/s, y:(cy-oy)/s};
}
let dragging=false, sx0, sy0;
mapEl.addEventListener("mousedown",(e)=>{
  if(e.target.closest(".statedot,.regionPath")) return;
  dragging=true; sx0=e.clientX-tx; sy0=e.clientY-ty; mapEl.classList.add("dragging");
});
window.addEventListener("mousemove",(e)=>{
  if(!dragging) return;
  const r=mapEl.getBoundingClientRect();
  const s=Math.min(r.width/1280,r.height/960);
  tx=(e.clientX-sx0)/s; ty=(e.clientY-sy0)/s; updateT();
});
window.addEventListener("mouseup",()=>{dragging=false;mapEl.classList.remove("dragging");});

/* ================================================================
   朝代切换
   ================================================================ */
const dynSwitch = document.getElementById("dynSwitch");
const dynYears  = document.getElementById("dynYears");
function renderDynSwitch(){
  dynSwitch.innerHTML = "";
  DYNASTIES.forEach(d=>{
    const b = document.createElement("button");
    b.textContent = d.name;
    b.dataset.key = d.key;
    if(d.key===currentDynasty) b.classList.add("on");
    b.addEventListener("click",()=>switchDynasty(d.key));
    dynSwitch.appendChild(b);
  });
}
function switchDynasty(key){
  currentDynasty = key;
  const d = dynastyOf();
  // 更新国号显示（不写回 DATA，仅展示）
  document.getElementById("dynasty").textContent = d.title;
  document.getElementById("subtitle").textContent = "疆域全图 · "+d.years+" · 五朝合制底图";
  dynYears.textContent = d.desc;
  renderDynSwitch();
  selected = null;
  render();
  renderPanel();
}
renderDynSwitch();
// 初始化国号显示
(function initDynasty(){
  const d = dynastyOf();
  document.getElementById("dynasty").textContent = d.title;
  dynYears.textContent = d.desc;
})();

/* ================================================================
   工具栏
   ================================================================ */
document.getElementById("dynasty").addEventListener("blur",(e)=>{
  DATA.dynasty=e.target.textContent.trim(); scheduleSave();
});
document.getElementById("subtitle").addEventListener("blur",(e)=>{
  DATA.subtitle=e.target.textContent.trim(); scheduleSave();
});
const editBtn=document.getElementById("editBtn");
editBtn.addEventListener("click",()=>{
  editing=!editing;
  document.body.classList.toggle("editing",editing);
  editBtn.textContent = editing?"✓ 完成编辑":"✎ 进入编辑";
  editBtn.classList.toggle("on",editing);
  const d=document.getElementById("dynasty");
  d.setAttribute("contenteditable",editing?"true":"false");
  document.getElementById("subtitle").setAttribute("contenteditable",editing?"true":"false");
  renderPanel();
});
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="疆域地图数据备份.json"; a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change",(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.regions) throw 0;
      DATA=d; scheduleSave(); boot(); alert("导入成功");
    }catch(err){alert("文件格式不正确");}
  };
  rd.readAsText(f);
});
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("确定恢复全部默认内容？当前修改将丢失（建议先导出备份）。")){
    DATA=structuredClone(DEFAULT_DATA); scheduleSave(); boot();
  }
};
document.getElementById("printBtn").onclick=()=>window.print();

/* ================================================================
   数据桥接：供 js/supabase-cloud.js 云端存取调用（只读/替换 DATA，
   不触碰原有绘图、节点、缩放、压感手绘等任何逻辑）
   ================================================================ */
window.getCanvasData = function(){ return structuredClone(DATA); };
window.setCanvasData = function(d){
  DATA = d;
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  render(); renderPanel();
};
window.clearCanvasData = function(){
  DATA = { dynasty:"【国号】", subtitle:"", regions:[] };
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  render(); renderPanel();
};

/* ================================================================
   启动
   ================================================================ */
function boot(){
  selected=null;
  switchDynasty(currentDynasty);   // 统一国号/副标题/说明并重绘
}
boot();
